<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>ThreeJS</title>
	<style>
		body {
			margin: 0;
			display: grid;
			grid-template-columns: 1fr 1fr 1fr;
			grid-template-rows: 1fr 1fr 1fr;
			gap: 5px 5px;
			grid-auto-flow: row;
			grid-template-areas:
				"mi-canvas mi-canvas-iso"
				"mi-canvas-puntos exportar-nube"
		}

		#mi-canvas {
			grid-area: mi-canvas;
		}

		#mi-canvas-puntos {
			grid-area: mi-canvas-puntos;
		}

		#mi-canvas-iso {
			grid-area: mi-canvas-iso;
		}

		#exportar-nube-container {
			grid-area: exportar-nube;
		}
	</style>
</head>

<body style="max-height: 1vp; overflow: hidden;">
	<canvas id="mi-canvas"></canvas>
	<canvas id="mi-iso-canvas"></canvas>
	<canvas id="mi-canvas-puntos"></canvas>
	<div id="exportar-nube-container">
		<button id="exportar-nube">Exportar nube de puntos</button>
		<div id="EstadoCarga"></div>
	</div>
	<script type="module" src="src/main.ts"></script>
</body>

</html>
